name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk elevator-bid-manager.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevator-bid-manager-apk
          path: elevator-bid-manager.apk
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 elevator-bid-manager.apk --clobber
          else
            gh release create v1.0.0 elevator-bid-manager.apk --title "입찰매니저 Android 앱" --notes "휴대폰에서 APK를 내려받아 설치하세요."
          fi
