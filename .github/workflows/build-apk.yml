name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build V9 installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk elevator-bid-manager-v9.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevator-bid-manager-v9-apk
          path: elevator-bid-manager-v9.apk
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v9.0.0 >/dev/null 2>&1; then
            gh release upload v9.0.0 elevator-bid-manager-v9.apk --clobber
          else
            gh release create v9.0.0 elevator-bid-manager-v9.apk --title "승강기 입찰매니저 V9" --notes "V9 서버 연결 및 실기 검증용 설치 APK입니다."
          fi
